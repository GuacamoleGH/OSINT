services:
  osint-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OSINT_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/.next/cache:size=128M,uid=1001,gid=1001
    cap_drop:
      - ALL
