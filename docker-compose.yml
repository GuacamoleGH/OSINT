services:
  osint-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-hub
    restart: unless-stopped
    ports:
      - "3104:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    security_opt:
      - no-new-privileges:true
